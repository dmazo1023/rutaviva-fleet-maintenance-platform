@if (open() && routine(); as r) {
  <div class="modal-backdrop">
    <dialog open class="params-dialog" tabindex="-1" aria-labelledby="params-dlg-title">
      <form (submit)="onSubmit($event)" novalidate>
        <div class="params-dialog__head">
          <div>
            <h2 id="params-dlg-title" class="params-dialog__title">
              {{ texts.adjustPrefix }}{{ r.name }}
            </h2>
            <p class="params-dialog__sub">{{ r.plate }} · {{ thresholdSourceText() }}</p>
          </div>
          <button
            type="button"
            class="icon-btn"
            [attr.aria-label]="texts.closeAria"
            (click)="onCancel()"
          >
            <span class="ms" aria-hidden="true">close</span>
          </button>
        </div>

        <div class="params-dialog__body">
          <div class="params-dialog__grid">
            <label class="params-dialog__field">
              <span>{{ texts.everyKmLabel }} ({{ texts.kmUnit }})</span>
              <input
                type="number"
                class="input params-dialog__input-km"
                [value]="kmInput()"
                [placeholder]="r.defaultIntervalKm.toString()"
                (input)="onKmInput($event)"
              />
            </label>

            <label class="params-dialog__field">
              <span>{{ texts.orEveryMonthsLabel }} ({{ texts.monthsUnit }})</span>
              <input
                type="number"
                class="input params-dialog__input-months"
                [value]="monthsInput()"
                [placeholder]="r.defaultIntervalMonths.toString()"
                (input)="onMonthsInput($event)"
              />
            </label>

            <label class="params-dialog__field">
              <span>{{ texts.warnAtPercentLabel }} ({{ texts.percentFinalUnit }})</span>
              <input
                type="number"
                class="input params-dialog__input-percent"
                [value]="percentInput()"
                [placeholder]="r.defaultDueSoonPercent.toString()"
                (input)="onPercentInput($event)"
              />
            </label>
          </div>

          @if (validationError(); as err) {
            <p class="params-dialog__error" role="alert">{{ err }}</p>
          }

          <div class="params-dialog__preview">
            @for (track of previewTracks(); track track.kind) {
              <app-routine-track [track]="track" />
            }
          </div>
        </div>

        <div class="params-dialog__foot">
          <button
            type="button"
            class="btn btn--ghost params-dialog__reset-btn"
            (click)="onResetDefaults()"
          >
            {{ texts.resetToTypeDefaults }}
          </button>
          <div class="params-dialog__foot-right">
            <button type="button" class="btn btn--ghost" (click)="onCancel()">
              {{ texts.cancel }}
            </button>
            <button
              type="submit"
              class="btn btn--primary params-dialog__save-btn"
              [disabled]="busy()"
              [attr.aria-busy]="busy() ? 'true' : null"
            >
              {{ busy() ? texts.saving : texts.save }}
            </button>
          </div>
        </div>
      </form>
    </dialog>
  </div>
}
