<div class="fleet-page">
  <div class="page-head">
    <h1 id="h1" tabindex="-1">{{ texts.title }}</h1>
    <span class="count tabular">{{ sortedVehicles().length }}</span>
  </div>

  <div class="toolbar">
    <app-segmented-filter
      [legend]="texts.statusLegend"
      name="fleet-status"
      [options]="filterOptions()"
      [selectedValue]="activeFilter()"
      defaultValue="All"
      queryParamKey="status"
      (valueChange)="onFilterChange($event)"
    />

    <div class="search">
      <span class="ms" aria-hidden="true">search</span>
      <input
        type="search"
        [value]="searchQuery()"
        [placeholder]="texts.searchPlaceholder"
        [attr.aria-label]="texts.searchAriaLabel"
        autocomplete="off"
        spellcheck="false"
        (input)="onSearchInput($event)"
      />
    </div>
  </div>

  @if (listLoadable().status === 'loading' && sortedVehicles().length === 0) {
    <app-skeleton [rows]="5" />
  } @else if (listLoadable().status === 'error') {
    <app-error-state
      [title]="texts.errorTitle"
      [message]="texts.errorMessage"
      [retryLabel]="texts.retry"
      (retryClicked)="onRetry()"
    />
  } @else if (sortedVehicles().length === 0) {
    <app-empty-state
      icon="local_shipping"
      [title]="texts.emptyTitle"
      [message]="texts.emptyMessage"
      [actionLabel]="texts.emptyAction"
      actionRoute="/carga"
    />
  } @else if (filteredVehicles().length === 0) {
    <app-empty-state
      icon="search_off"
      [title]="texts.noMatches"
      [actionLabel]="texts.clearFilters"
      (actionClicked)="onClearFilters()"
    />
  } @else {
    <app-vehicle-list
      [vehicles]="filteredVehicles()"
      [flashedIds]="flashedIds()"
      (selectVehicle)="onSelectVehicle($event)"
    />
  }
</div>
